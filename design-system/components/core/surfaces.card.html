<!-- @dsCard group="Components" viewport="700x340" name="Core — cards, headings, stats" subtitle="Hairline surfaces, section heading rhythm, evidenced figures" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>FACEU card</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;background:var(--surface-page)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.stack{display:flex;flex-direction:column;gap:18px}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.FACEUDesignSystem_27f931;

const { Card, SectionHeading, Stat, Button } = NS;
function Demo(){return(<div className="stack">
  <SectionHeading eyebrow="Tools" title="Instruments built inside the project" description="Each tool ships with a manual, a version history and a named maintainer." action={<Button size="sm" variant="outline" iconAfter="arrow-right">All tools</Button>} style={{marginBottom:0}}/>
  <div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:12}}>
    <Card tone="light"><div className="lbl">light</div><p style={{marginTop:8,fontSize:14}}>Default surface for catalog content.</p></Card>
    <Card tone="subtle"><div className="lbl">subtle</div><p style={{marginTop:8,fontSize:14}}>Nested inside white sections.</p></Card>
    <Card tone="gold"><div className="lbl">gold</div><p style={{marginTop:8,fontSize:14}}>Documentation emphasis.</p></Card>
  </div>
  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
    <Card tone="dark"><div className="lbl" style={{color:"rgba(255,255,255,.45)"}}>dark</div><p style={{marginTop:8,fontSize:14}}>Featured tool inside a navy band.</p></Card>
    <Card tone="hero" style={{display:"flex",gap:24}}>
      <Stat value="6" label="Tools released" note="with manuals"/><Stat value="4" label="Institutions"/>
    </Card>
  </div>
</div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
