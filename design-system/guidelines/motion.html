<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-body)}.g{display:grid;gap:10px}.sw{border-radius:var(--radius-sm);height:62px;display:flex;align-items:flex-end;padding:8px;box-shadow:var(--inset-hairline)}.n{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;line-height:1.5}.n b{display:block;font-weight:500}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><style>@keyframes slide{0%,12%{transform:translateX(0)}50%,62%{transform:translateX(150px)}100%{transform:translateX(0)}}.bar{width:34px;height:34px;border-radius:var(--radius-sm);background:var(--grad-gold);animation:slide 2.6s var(--ease-standard) infinite}@media (prefers-reduced-motion:reduce){.bar{animation:none}}</style>
<div style="display:flex;align-items:center;gap:28px">
<div class="bar"></div>
<div style="font-family:var(--font-mono);font-size:11px;line-height:2;letter-spacing:.04em;color:var(--text-muted)">--dur-fast 120ms · press &amp; colour<br>--dur-base 200ms · hover, tabs, fields<br>--dur-slow 320ms · panels, disclosure<br>--ease-standard cubic-bezier(.2,.6,.25,1)<br>--lift-hover -2px · --press-scale .985</div>
</div></body></html>
