<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Surfaces</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-body)}.g{display:grid;gap:10px}.sw{border-radius:var(--radius-sm);height:62px;display:flex;align-items:flex-end;padding:8px;box-shadow:var(--inset-hairline)}.n{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;line-height:1.5}.n b{display:block;font-weight:500}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)">
<div><div class="sw" style="background:var(--surface-page)"></div><div class="n" style="margin-top:6px"><b style="color:var(--text-strong)">page</b><span style="color:var(--text-muted)">--surface-page</span></div></div><div><div class="sw" style="background:var(--surface-subtle)"></div><div class="n" style="margin-top:6px"><b style="color:var(--text-strong)">subtle</b><span style="color:var(--text-muted)">--surface-subtle</span></div></div><div><div class="sw" style="background:var(--surface-inset)"></div><div class="n" style="margin-top:6px"><b style="color:var(--text-strong)">inset</b><span style="color:var(--text-muted)">--surface-inset</span></div></div><div><div class="sw" style="background:var(--surface-gold-soft)"></div><div class="n" style="margin-top:6px"><b style="color:var(--text-strong)">gold-soft</b><span style="color:var(--text-muted)">--surface-gold-soft</span></div></div><div><div class="sw" style="background:var(--surface-dark-card)"></div><div class="n" style="margin-top:6px"><b style="color:var(--text-strong)">dark-card</b><span style="color:var(--text-muted)">--surface-dark-card</span></div></div>
</div></body></html>
