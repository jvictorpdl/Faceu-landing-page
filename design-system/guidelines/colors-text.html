<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Text</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-body)}.g{display:grid;gap:10px}.sw{border-radius:var(--radius-sm);height:62px;display:flex;align-items:flex-end;padding:8px;box-shadow:var(--inset-hairline)}.n{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;line-height:1.5}.n b{display:block;font-weight:500}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div style="border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:14px 16px;display:grid;gap:7px">
<div style="color:var(--text-strong);font-size:15px;font-weight:500">--text-strong · headings</div>
<div style="color:var(--text-body);font-size:14px">--text-body · paragraphs</div>
<div style="color:var(--text-muted);font-size:14px">--text-muted · support</div>
<div style="color:var(--text-faint);font-size:13px">--text-faint · metadata</div>
<div style="color:var(--text-accent);font-size:13px;font-family:var(--font-mono);letter-spacing:.08em">--TEXT-ACCENT · EYEBROWS</div></div>
<div style="background:var(--grad-hero);border-radius:var(--radius-md);padding:14px 16px;display:grid;gap:7px">
<div style="color:var(--text-on-dark);font-size:15px;font-weight:500">--text-on-dark · headings</div>
<div style="color:var(--text-on-dark-muted);font-size:14px">--text-on-dark-muted · body</div>
<div style="color:var(--gold-400);font-size:13px;font-family:var(--font-mono);letter-spacing:.08em">--GOLD-400 · EYEBROWS ON NAVY</div></div>
</div></body></html>
