<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Gradients</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-body)}.g{display:grid;gap:10px}.sw{border-radius:var(--radius-sm);height:62px;display:flex;align-items:flex-end;padding:8px;box-shadow:var(--inset-hairline)}.n{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;line-height:1.5}.n b{display:block;font-weight:500}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div style="display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px">

<div><div style="height:88px;border-radius:var(--radius-md);background:var(--grad-gold)"></div><div class="n" style="margin-top:6px;color:var(--text-muted)">--grad-gold</div></div>

</div></body></html>
