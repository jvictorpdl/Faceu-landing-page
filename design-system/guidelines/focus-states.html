<!-- @dsCard group="Brand" viewport="700x150" name="Focus & interaction states" subtitle="Cyan 2px focus ring, gold hover, 0.985 press" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Focus</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-body)}.g{display:grid;gap:10px}.sw{border-radius:var(--radius-sm);height:62px;display:flex;align-items:flex-end;padding:8px;box-shadow:var(--inset-hairline)}.n{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;line-height:1.5}.n b{display:block;font-weight:500}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-family:var(--font-body);font-size:14px;font-weight:600">
<span style="padding:11px 20px;border-radius:999px;background:var(--grad-gold);color:var(--ink-900)">Rest</span>
<span style="padding:11px 20px;border-radius:999px;background:var(--grad-gold);color:var(--ink-900);box-shadow:var(--shadow-gold);filter:brightness(1.04)">Hover</span>
<span style="padding:11px 20px;border-radius:999px;background:var(--grad-gold);color:var(--ink-900);transform:scale(.985)">Press</span>
<span style="padding:11px 20px;border-radius:999px;background:var(--grad-gold);color:var(--ink-900);outline:2px solid var(--signal-500);outline-offset:2px">Focus</span>
<span style="padding:11px 20px;border-radius:999px;background:var(--grad-gold);color:var(--ink-900);opacity:.45">Disabled</span>
</div></body></html>
